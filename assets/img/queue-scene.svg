<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">Immigration queue at a Vietnam airport</title>
<desc id="d">Flat illustration: travelers wait in a roped queue under an IMMIGRATION sign at a dark navy airport terminal, with a wall clock showing a long wait.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0d1526"/>
    <stop offset="1" stop-color="#16233d"/>
  </linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1b2c4a"/>
    <stop offset="1" stop-color="#101a30"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<rect y="440" width="1200" height="235" fill="url(#floor)"/>
<g opacity=".8">
  <rect x="70" y="60" width="1060" height="200" rx="14" fill="#0a1120" stroke="#22345a" stroke-width="2"/>
  <line x1="430" y1="60" x2="430" y2="260" stroke="#22345a" stroke-width="2"/>
  <line x1="790" y1="60" x2="790" y2="260" stroke="#22345a" stroke-width="2"/>
  <g fill="#c9a227" opacity=".5">
    <circle cx="140" cy="230" r="4"/><circle cx="230" cy="230" r="4"/><circle cx="520" cy="230" r="4"/><circle cx="640" cy="230" r="4"/><circle cx="930" cy="230" r="4"/><circle cx="1050" cy="230" r="4"/>
  </g>
  <!-- plane silhouette -->
  <g fill="#2a3d63" transform="translate(880,120)">
    <path d="M0 40 L60 40 L90 20 L98 20 L80 40 L120 40 L120 46 L80 46 L98 66 L90 66 L60 46 L0 46 Z"/>
  </g>
</g>
<!-- IMMIGRATION sign -->
<g>
  <rect x="430" y="290" width="340" height="64" rx="10" fill="#12233f" stroke="#c9a227" stroke-width="2"/>
  <text x="600" y="332" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#e8ecf1" text-anchor="middle" letter-spacing="6">IMMIGRATION</text>
</g>
<!-- wall clock -->
<g transform="translate(160,160)">
  <circle r="44" fill="#0a1120" stroke="#c9a227" stroke-width="3"/>
  <line x1="0" y1="0" x2="0" y2="-28" stroke="#e8ecf1" stroke-width="4" stroke-linecap="round"/>
  <line x1="0" y1="0" x2="20" y2="10" stroke="#e8ecf1" stroke-width="4" stroke-linecap="round"/>
  <circle r="4" fill="#c9a227"/>
</g>
<!-- rope barriers -->
<g stroke="#c9a227" stroke-width="4" fill="none">
  <path d="M140 520 Q 320 480 500 520 T 860 520" opacity=".9"/>
  <path d="M140 600 Q 320 560 500 600 T 860 600" opacity=".9"/>
</g>
<g fill="#22345a">
  <rect x="132" y="470" width="14" height="150" rx="7"/>
  <rect x="492" y="470" width="14" height="150" rx="7"/>
  <rect x="852" y="470" width="14" height="150" rx="7"/>
</g>
<!-- queue travelers -->
<g>
  <!-- p1 -->
  <g transform="translate(250,470)">
    <circle cx="0" cy="0" r="20" fill="#c9a227"/>
    <rect x="-26" y="24" width="52" height="78" rx="20" fill="#2a3d63"/>
    <rect x="30" y="60" width="34" height="46" rx="6" fill="#12233f" stroke="#c9a227" stroke-width="2"/>
  </g>
  <!-- p2 -->
  <g transform="translate(430,500)">
    <circle cx="0" cy="0" r="20" fill="#d9b64a"/>
    <rect x="-26" y="24" width="52" height="78" rx="20" fill="#22345a"/>
  </g>
  <!-- p3 -->
  <g transform="translate(620,480)">
    <circle cx="0" cy="0" r="20" fill="#c9a227"/>
    <rect x="-26" y="24" width="52" height="78" rx="20" fill="#2a3d63"/>
    <rect x="-64" y="66" width="34" height="46" rx="6" fill="#12233f" stroke="#c9a227" stroke-width="2"/>
  </g>
  <!-- p4 -->
  <g transform="translate(760,510)">
    <circle cx="0" cy="0" r="20" fill="#d9b64a"/>
    <rect x="-26" y="24" width="52" height="78" rx="20" fill="#22345a"/>
  </g>
</g>
<!-- counter booth -->
<g transform="translate(980,380)">
  <rect width="160" height="220" rx="12" fill="#12233f" stroke="#22345a" stroke-width="2"/>
  <rect x="14" y="14" width="132" height="110" rx="8" fill="#0a1120" stroke="#c9a227" stroke-width="2"/>
  <circle cx="80" cy="60" r="18" fill="#c9a227"/>
  <rect x="58" y="80" width="44" height="34" rx="12" fill="#2a3d63"/>
  <rect x="14" y="140" width="132" height="14" rx="7" fill="#22345a"/>
  <rect x="14" y="168" width="90" height="14" rx="7" fill="#22345a" opacity=".7"/>
</g>
</svg>
