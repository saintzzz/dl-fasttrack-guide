<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">Vietnam SIM card and smartphone at the airport</title>
<desc id="d">Flat illustration: a smartphone with a SIM card being inserted, signal waves rising, and a SIM kiosk sign in a dark navy airport terminal - gold accents.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0d1526"/>
    <stop offset="1" stop-color="#16233d"/>
  </linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1b2c4a"/>
    <stop offset="1" stop-color="#101a30"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<rect y="470" width="1200" height="205" fill="url(#floor)"/>
<!-- SIM kiosk sign -->
<g>
  <rect x="440" y="80" width="320" height="70" rx="10" fill="#12233f" stroke="#c9a227" stroke-width="2"/>
  <text x="600" y="127" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#e8ecf1" text-anchor="middle" letter-spacing="5">SIM &amp; DATA</text>
</g>
<!-- smartphone -->
<g transform="translate(470,200) rotate(-6)">
  <rect width="170" height="330" rx="22" fill="#0a1120" stroke="#c9a227" stroke-width="4"/>
  <rect x="12" y="14" width="146" height="270" rx="12" fill="#12233f"/>
  <!-- screen content -->
  <g fill="#22345a">
    <rect x="28" y="40" width="114" height="14" rx="7"/>
    <rect x="28" y="66" width="80" height="14" rx="7" opacity=".7"/>
  </g>
  <!-- signal bars on screen -->
  <g fill="#c9a227">
    <rect x="34" y="240" width="14" height="30" rx="3"/>
    <rect x="54" y="226" width="14" height="44" rx="3"/>
    <rect x="74" y="212" width="14" height="58" rx="3"/>
    <rect x="94" y="198" width="14" height="72" rx="3" opacity=".55"/>
    <rect x="114" y="184" width="14" height="86" rx="3" opacity=".3"/>
  </g>
  <rect x="66" y="296" width="38" height="8" rx="4" fill="#22345a"/>
  <!-- open SIM tray -->
  <rect x="170" y="120" width="46" height="26" rx="6" fill="#12233f" stroke="#c9a227" stroke-width="3"/>
</g>
<!-- SIM card flying toward tray -->
<g transform="translate(740,290) rotate(14)">
  <path d="M0 0 h72 l18 18 v54 h-90 Z" fill="#c9a227"/>
  <rect x="16" y="26" width="44" height="32" rx="5" fill="#12233f"/>
  <line x1="30" y1="26" x2="30" y2="58" stroke="#c9a227" stroke-width="2"/>
  <line x1="44" y1="26" x2="44" y2="58" stroke="#c9a227" stroke-width="2"/>
  <line x1="16" y1="42" x2="60" y2="42" stroke="#c9a227" stroke-width="2"/>
</g>
<!-- signal waves -->
<g fill="none" stroke="#c9a227" stroke-width="5" stroke-linecap="round" opacity=".85">
  <path d="M560 130 a90 90 0 0 1 90 90"/>
  <path d="M560 100 a120 120 0 0 1 120 120" opacity=".6"/>
  <path d="M560 70 a150 150 0 0 1 150 150" opacity=".35"/>
</g>
<!-- carrier chips -->
<g font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">
  <rect x="150" y="200" width="130" height="46" rx="23" fill="#12233f" stroke="#22345a" stroke-width="2"/>
  <text x="215" y="229" fill="#e8ecf1" text-anchor="middle">Viettel</text>
  <rect x="140" y="266" width="130" height="46" rx="23" fill="#12233f" stroke="#22345a" stroke-width="2"/>
  <text x="205" y="295" fill="#e8ecf1" text-anchor="middle">Vinaphone</text>
  <rect x="155" y="332" width="130" height="46" rx="23" fill="#12233f" stroke="#22345a" stroke-width="2"/>
  <text x="220" y="361" fill="#e8ecf1" text-anchor="middle">Mobifone</text>
</g>
<!-- price tag -->
<g transform="translate(900,420) rotate(8)">
  <path d="M0 0 h150 l24 24 v60 h-174 Z" fill="#12233f" stroke="#c9a227" stroke-width="3"/>
  <circle cx="158" cy="18" r="5" fill="#c9a227"/>
  <text x="80" y="42" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#c9a227" text-anchor="middle">7 DAYS</text>
  <text x="80" y="66" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#e8ecf1" text-anchor="middle">~US$10 data</text>
</g>
</svg>
