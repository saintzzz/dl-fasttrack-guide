<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">Family with children and elderly at a Vietnam airport</title>
<desc id="d">Flat illustration: a family group - parent holding a child's hand, a stroller, and an elderly traveler with a cane - walks together through a dark navy airport terminal.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0d1526"/>
    <stop offset="1" stop-color="#16233d"/>
  </linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1b2c4a"/>
    <stop offset="1" stop-color="#101a30"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<rect y="440" width="1200" height="235" fill="url(#floor)"/>
<!-- window band -->
<g opacity=".8">
  <rect x="70" y="70" width="1060" height="220" rx="14" fill="#0a1120" stroke="#22345a" stroke-width="2"/>
  <line x1="430" y1="70" x2="430" y2="290" stroke="#22345a" stroke-width="2"/>
  <line x1="790" y1="70" x2="790" y2="290" stroke="#22345a" stroke-width="2"/>
  <g fill="#c9a227" opacity=".5">
    <circle cx="160" cy="260" r="4"/><circle cx="300" cy="260" r="4"/><circle cx="560" cy="260" r="4"/><circle cx="700" cy="260" r="4"/><circle cx="950" cy="260" r="4"/><circle cx="1080" cy="260" r="4"/>
  </g>
  <!-- sun over wing view -->
  <circle cx="920" cy="140" r="34" fill="#c9a227" opacity=".35"/>
</g>
<!-- family group -->
<g>
  <!-- elderly with cane -->
  <g transform="translate(280,380)">
    <circle cx="0" cy="0" r="24" fill="#d9b64a"/>
    <rect x="-30" y="28" width="60" height="96" rx="24" fill="#22345a"/>
    <line x1="44" y1="60" x2="44" y2="150" stroke="#c9a227" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- parent -->
  <g transform="translate(500,360)">
    <circle cx="0" cy="0" r="26" fill="#c9a227"/>
    <rect x="-34" y="30" width="68" height="120" rx="26" fill="#2a3d63"/>
  </g>
  <!-- child holding parent's hand -->
  <g transform="translate(610,420)">
    <circle cx="0" cy="0" r="18" fill="#d9b64a"/>
    <rect x="-24" y="20" width="48" height="72" rx="20" fill="#22345a"/>
    <line x1="-46" y1="10" x2="-24" y2="30" stroke="#c9a227" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- stroller -->
  <g transform="translate(780,420)">
    <path d="M0 30 Q 30 -14 60 30 L 60 66 L 0 66 Z" fill="#12233f" stroke="#c9a227" stroke-width="3"/>
    <line x1="60" y1="30" x2="86" y2="8" stroke="#c9a227" stroke-width="5" stroke-linecap="round"/>
    <circle cx="14" cy="78" r="9" fill="#22345a" stroke="#c9a227" stroke-width="2"/>
    <circle cx="50" cy="78" r="9" fill="#22345a" stroke="#c9a227" stroke-width="2"/>
    <circle cx="30" cy="6" r="10" fill="#d9b64a"/>
  </g>
  <!-- luggage pile -->
  <g transform="translate(950,430)">
    <rect x="0" y="0" width="66" height="56" rx="8" fill="#12233f" stroke="#c9a227" stroke-width="2"/>
    <rect x="8" y="62" width="80" height="44" rx="8" fill="#2a3d63" stroke="#c9a227" stroke-width="2"/>
  </g>
</g>
<!-- escort agent with sign -->
<g transform="translate(140,360)">
  <circle cx="0" cy="0" r="26" fill="#c9a227"/>
  <rect x="-34" y="30" width="68" height="120" rx="26" fill="#12233f" stroke="#c9a227" stroke-width="2"/>
  <rect x="40" y="-50" width="90" height="56" rx="8" fill="#e8ecf1"/>
  <text x="85" y="-14" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#12233f" text-anchor="middle">AAL</text>
</g>
</svg>
